popup cx=132 cy=304 w=208 h=40 label="WAVE" key=wave cols=3
popup cx=397 cy=385 w=258 h=38 label="LFO_WAVE" key=lfo_wave cols=3
popup cx=132 cy=399 w=208 h=38 label="MODE" key=mode cols=3
popup cx=647 cy=392 w=178 h=40 label="FILTER_TYPE" key=filter_type cols=3
popup cx=906 cy=396 w=276 h=40 label="CHARACTER" key=character cols=3

