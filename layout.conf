# Dub Force: original charcoal / warm cream / amber performance panel.
# Native skin is generated by tools/skin_design.py; this file records the
# logical layout and stable popup IDs for parameter-header generation.
# Coordinates here use Shadow y+86; generator control bounds are native y.
style=td3
theme_bg=161716
theme_ink=F1E8D6
theme_ink_dim=B7B0A1
theme_accent=E6AE55
theme_accent_hi=F4C779
theme_box=20221F
theme_line=444740
qlinks_track = pitch,rate,depth,zap_sweep,cutoff,resonance,delay_time,feedback

[tab SIREN]
# Preserve shipped hidden popup indices51..56 in their original order.
# Five selector flags are retained for compatibility; final selectors are
# visible image buttons rather than popup fields. Only PATCH opens a list.
